# 生成贪吃蛇动画与 3D 城市贡献图，产出物发布到 output 分支
name: 生成贡献图资产

on:
  # 每天 UTC 03:41（北京时间 11:41）执行，避开整点排队
  schedule:
    - cron: "41 3 * * *"
  # 手动触发：首次启用或补图时在 Actions 页点一下
  workflow_dispatch:
  # main 有更新时重建
  push:
    branches:
      - main

jobs:
  generate:
    name: 构建并发布 SVG 资产
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      # 冷色系：color_dots 共 5 个颜色，依次为 0 次贡献和四个由浅到深的档位
      - name: 生成贪吃蛇 SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: PaperKoi001
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#0f172a&color_dots=#e2e8f0,#67e8f9,#22d3ee,#0891b2,#155e75
            dist/github-contribution-grid-snake-dark.svg?color_snake=#e2e8f0&color_dots=#16202e,#164e63,#0e7490,#06b6d4,#67e8f9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成 3D 城市贡献图
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: PaperKoi001
          SETTING_JSON: .github/assets/profile-3d-contrib.json

      - name: 合并 SVG 到 dist
        run: |
          mkdir -p dist/profile-3d-contrib
          cp -r profile-3d-contrib/* dist/profile-3d-contrib/

      - name: 发布到 output 分支
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
